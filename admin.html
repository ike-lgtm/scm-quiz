<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SCM QUIZ 運営画面</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    .container {
      width: min(94%, 950px);
      margin: 0 auto;
      padding: 30px 0 60px;
    }

    h1 { margin-bottom: 5px; }

    .subtitle {
      color: #666;
      margin-bottom: 24px;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      padding: 22px;
      margin-bottom: 18px;
      box-shadow: 0 5px 20px rgba(0,0,0,.07);
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .stat {
      background: #f7f7f7;
      border-radius: 12px;
      padding: 18px;
      text-align: center;
    }

    .stat-label {
      color: #666;
      font-size: 14px;
      margin-bottom: 5px;
    }

    .stat-number {
      font-size: 34px;
      font-weight: bold;
    }

    .current-box {
      text-align: center;
    }

    .current-label {
      color: #777;
      font-size: 14px;
    }

    .current-question {
      font-size: 42px;
      font-weight: bold;
      margin: 8px 0;
    }

    .current-status {
      font-size: 20px;
      font-weight: bold;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1.3fr 1fr;
      gap: 12px;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 16px 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: .88;
    }

    button:disabled {
      opacity: .4;
      cursor: default;
    }

    .secondary {
      background: #e9edf2;
      color: #222;
    }

    .primary {
      background: #222;
      color: #fff;
    }

    .result {
      background: #e7f3ff;
      color: #075985;
    }

    .ranking {
      background: #fff4cc;
      color: #744b00;
    }

    .danger {
      width: 100%;
      background: #b42318;
      color: #fff;
    }

    .danger-zone {
      border: 2px solid #ffd4d0;
    }

    .progress {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
    }

    .progress-item {
      padding: 8px 12px;
      border-radius: 999px;
      background: #eee;
      font-size: 13px;
      font-weight: bold;
    }

    .progress-item.active {
      background: #222;
      color: #fff;
    }

    .list {
      display: grid;
      gap: 8px;
      margin-top: 12px;
    }

    .item {
      padding: 11px 12px;
      background: #f7f7f7;
      border-radius: 8px;
    }

    .score {
      font-weight: bold;
    }

    .notice {
      font-size: 13px;
      color: #777;
      line-height: 1.6;
    }

    @media(max-width: 650px) {
      .stats,
      .controls {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <h1>SCM QUIZ 運営画面</h1>
  <div class="subtitle">
    本番進行用コントローラー
  </div>


  <!-- 現在 -->
  <div class="card current-box">

    <div class="current-label">
      現在
    </div>

    <div id="currentQuestion" class="current-question">
      待機
    </div>

    <div id="currentStatus" class="current-status">
      開始前
    </div>

  </div>


  <!-- 数値 -->
  <div class="card">

    <div class="stats">

      <div class="stat">
        <div class="stat-label">
          参加チーム
        </div>
        <div id="teamCount" class="stat-number">
          0
        </div>
      </div>

      <div class="stat">
        <div class="stat-label">
          回答済み
        </div>
        <div id="answerCount" class="stat-number">
          0
        </div>
      </div>

      <div class="stat">
        <div class="stat-label">
          未回答
        </div>
        <div id="unansweredCount" class="stat-number">
          0
        </div>
      </div>

    </div>

  </div>


  <!-- 進行 -->
  <div class="card">

    <h2>進行操作</h2>

    <div class="controls">

      <button id="previousButton" class="secondary">
        ← 前の問題
      </button>

      <button id="resultButton" class="result">
        正解発表・得点確定
      </button>

      <button id="nextButton" class="primary">
        次の問題 →
      </button>

    </div>

    <div style="margin-top:12px;">

      <button id="waitingButton" class="secondary" style="width:100%;">
        待機画面に戻す
      </button>

    </div>

    <div id="progress" class="progress"></div>

  </div>


  <!-- ランキング操作 -->
  <div class="card">

    <h2>ランキング</h2>

    <p class="notice">
      Q5終了後は中間ランキング、
      Q10終了後は最終ランキングで使用します。
    </p>

    <div class="controls" style="grid-template-columns:1fr 1fr;">

      <button id="midRankingButton" class="ranking">
        中間ランキング表示
      </button>

      <button id="finalRankingButton" class="ranking">
        最終ランキング表示
      </button>

    </div>

  </div>


  <!-- 回答 -->
  <div class="card">

    <h2>現在の回答状況</h2>

    <div id="answerList" class="list">
      まだ回答はありません
    </div>

  </div>


  <!-- 得点 -->
  <div class="card">

    <h2>現在の総合順位</h2>

    <div id="scoreList" class="list">
      まだ得点はありません
    </div>

  </div>


  <!-- チーム -->
  <div class="card">

    <h2>参加チーム</h2>

    <div id="teamList" class="list">
      まだ参加チームはありません
    </div>

  </div>


  <!-- リセット -->
  <div class="card danger-zone">

    <h2>テスト用リセット</h2>

    <p>
      チーム・回答・得点・開始時刻を
      すべて削除します。
    </p>

    <button id="resetButton" class="danger">
      テストデータを全削除
    </button>

    <p class="notice">
      ※本番開始後は使用しないでください。
    </p>

  </div>

</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
  getDatabase,
  ref,
  onValue,
  set,
  get,
  remove,
  update,
  serverTimestamp
}
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";


const firebaseConfig = {
  apiKey: "AIzaSyAVazxROYpygBw0xMhJlhbvrAaF1pmicEc",
  authDomain: "scm-quiz-df0e6.firebaseapp.com",
  databaseURL: "https://scm-quiz-df0e6-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "scm-quiz-df0e6",
  storageBucket: "scm-quiz-df0e6.firebasestorage.app",
  messagingSenderId: "30616205850",
  appId: "1:30616205850:web:224b6386ee807700d26fa3"
};

const app = initializeApp(firebaseConfig);
const database = getDatabase(app);


/* ==============================
   問題順
============================== */

const questionOrder = [
  "practice",
  "q1",
  "q2",
  "q3",
  "q4",
  "q5",
  "q6",
  "q7",
  "q8",
  "q9",
  "q10"
];


/* ==============================
   正解

   0=A / 1=B / 2=C / 3=D

   未完成問題はnull
============================== */

const correctAnswers = {

  practice: 1,

  q1: 0,

  q2: 0,

  q3: null,

  q4: null,

  q5: 3,

  q6: null,

  q7: null,

  q8: null,

  q9: null,

  q10: null

};


/* ==============================
   DOM
============================== */

const currentQuestionElement =
  document.getElementById("currentQuestion");

const currentStatus =
  document.getElementById("currentStatus");

const teamCount =
  document.getElementById("teamCount");

const answerCount =
  document.getElementById("answerCount");

const unansweredCount =
  document.getElementById("unansweredCount");

const teamList =
  document.getElementById("teamList");

const answerList =
  document.getElementById("answerList");

const scoreList =
  document.getElementById("scoreList");

const progress =
  document.getElementById("progress");

const previousButton =
  document.getElementById("previousButton");

const nextButton =
  document.getElementById("nextButton");

const resultButton =
  document.getElementById("resultButton");

const waitingButton =
  document.getElementById("waitingButton");

const midRankingButton =
  document.getElementById("midRankingButton");

const finalRankingButton =
  document.getElementById("finalRankingButton");

const resetButton =
  document.getElementById("resetButton");


let teams = {};

let currentQuestionKey = null;

let currentPhase = "waiting";

let unsubscribeAnswers = null;


/* ==============================
   表示名
============================== */

function getLabel(key) {

  if (key === "practice") {
    return "練習問題";
  }

  if (!key) {
    return "待機";
  }

  return key.toUpperCase();

}


/* ==============================
   進捗表示
============================== */

function renderProgress() {

  progress.innerHTML = "";

  questionOrder.forEach(key => {

    const div =
      document.createElement("div");

    div.className =
      "progress-item";

    if (key === currentQuestionKey) {

      div.classList.add(
        "active"
      );

    }

    div.textContent =
      getLabel(key);

    progress.appendChild(div);

  });

}


/* ==============================
   チーム監視
============================== */

onValue(
  ref(database, "teams"),

  snapshot => {

    teams =
      snapshot.val() || {};

    const entries =
      Object.entries(teams);

    teamCount.textContent =
      entries.length;


    teamList.innerHTML = "";

    if (entries.length === 0) {

      teamList.textContent =
        "まだ参加チームはありません";

    } else {

      entries.forEach(
        ([id, team], index) => {

          const div =
            document.createElement("div");

          div.className =
            "item";

          div.textContent =
            `${index + 1}. ${team.name}`;

          teamList.appendChild(div);

        }
      );

    }


    updateUnanswered();

    renderScores();

  }
);


/* ==============================
   GAME監視
============================== */

onValue(
  ref(database, "game"),

  snapshot => {

    const game =
      snapshot.val();


    if (!game) {

      currentQuestionKey = null;
      currentPhase = "waiting";

      currentQuestionElement.textContent =
        "待機";

      currentStatus.textContent =
        "開始前";

      watchAnswers(null);

      renderProgress();

      return;

    }


    currentQuestionKey =
      game.currentQuestion || null;

    currentPhase =
      game.phase || "waiting";


    currentQuestionElement.textContent =
      getLabel(currentQuestionKey);


    if (
      currentPhase === "waiting"
    ) {

      currentStatus.textContent =
        "待機中";

      watchAnswers(null);

    }

    else if (
      currentPhase === "question"
    ) {

      currentStatus.textContent =
        "出題中";

      watchAnswers(
        currentQuestionKey
      );

    }

    else if (
      currentPhase === "result"
    ) {

      currentStatus.textContent =
        "正解発表中";

      watchAnswers(
        currentQuestionKey
      );

    }

    else if (
      currentPhase === "ranking"
    ) {

      currentStatus.textContent =
        "中間ランキング表示中";

    }

    else if (
      currentPhase === "final"
    ) {

      currentStatus.textContent =
        "最終ランキング表示中";

    }


    renderProgress();

  }
);


/* ==============================
   回答監視
============================== */

let currentAnswerTotal = 0;


function watchAnswers(key) {

  if (unsubscribeAnswers) {

    unsubscribeAnswers();

    unsubscribeAnswers = null;

  }


  currentAnswerTotal = 0;

  answerCount.textContent =
    "0";

  updateUnanswered();


  if (!key) {

    answerList.textContent =
      "まだ回答はありません";

    return;

  }


  unsubscribeAnswers =
    onValue(

      ref(
        database,
        `answers/${key}`
      ),

      snapshot => {

        const answers =
          snapshot.val() || {};

        const entries =
          Object.values(answers);


        currentAnswerTotal =
          entries.length;


        answerCount.textContent =
          entries.length;


        updateUnanswered();


        answerList.innerHTML = "";


        if (
          entries.length === 0
        ) {

          answerList.textContent =
            "まだ回答はありません";

          return;

        }


        const letters =
          ["A","B","C","D"];


        entries.forEach(answer => {

          const div =
            document.createElement("div");

          div.className =
            "item";

          div.textContent =
            `${answer.teamName}：${letters[answer.choice] ?? "-"}`;

          answerList.appendChild(div);

        });

      }

    );

}


function updateUnanswered() {

  const total =
    Object.keys(teams).length;


  unansweredCount.textContent =
    Math.max(
      0,
      total -
      currentAnswerTotal
    );

}


/* ==============================
   得点監視
============================== */

let allScores = {};


onValue(
  ref(database, "scores"),

  snapshot => {

    allScores =
      snapshot.val() || {};

    renderScores();

  }
);


function renderScores() {

  const ranking =
    Object.entries(teams)
      .map(([teamId, team]) => {

        const scores =
          allScores[teamId] || {};


        const total =
          Object.values(scores)
            .reduce(
              (sum, value) =>
                sum + Number(value || 0),
              0
            );


        return {
          teamId,
          name: team.name,
          total
        };

      });


  ranking.sort(
    (a,b) =>
      b.total - a.total
  );


  scoreList.innerHTML = "";


  if (
    ranking.length === 0
  ) {

    scoreList.textContent =
      "まだ得点はありません";

    return;

  }


  ranking.forEach(
    (team, index) => {

      const div =
        document.createElement("div");

      div.className =
        "item";


      div.innerHTML =
        `${index + 1}位　${team.name}
         <span class="score">
         ：${team.total.toLocaleString()} pt
         </span>`;


      scoreList.appendChild(div);

    }
  );

}


/* ==============================
   問題開始
============================== */

async function startQuestion(key) {

  /*
    同じ問題を再スタートする場合は
    その問題の過去回答・得点を消す
  */

  await remove(
    ref(
      database,
      `answers/${key}`
    )
  );


  if (key !== "practice") {

    const updates = {};

    Object.keys(teams).forEach(
      teamId => {

        updates[
          `scores/${teamId}/${key}`
        ] = null;

      }
    );

    if (
      Object.keys(updates).length > 0
    ) {

      await update(
        ref(database),
        updates
      );

    }

  }


  /*
    Firebaseサーバー時刻を
    roundsへ保存
  */

  await set(
    ref(
      database,
      `rounds/${key}`
    ),
    {
      startedAt:
        serverTimestamp()
    }
  );


  /*
    確定した時刻を取得
  */

  const roundSnapshot =
    await get(
      ref(
        database,
        `rounds/${key}`
      )
    );


  const round =
    roundSnapshot.val();


  if (
    !round ||
    typeof round.startedAt !== "number"
  ) {

    alert(
      "開始時刻の取得に失敗しました。もう一度お試しください。"
    );

    return;

  }


  /*
    全参加者へ出題通知
  */

  await set(
    ref(database, "game"),
    {
      phase: "question",
      currentQuestion: key,
      startedAt: round.startedAt
    }
  );

}


/* ==============================
   次の問題
============================== */

nextButton.addEventListener(
  "click",
  async () => {

    let nextIndex;


    if (!currentQuestionKey) {

      nextIndex = 0;

    } else {

      nextIndex =
        questionOrder.indexOf(
          currentQuestionKey
        ) + 1;

    }


    if (
      nextIndex >=
      questionOrder.length
    ) {

      alert(
        "Q10まで終了しています。"
      );

      return;

    }


    const nextKey =
      questionOrder[nextIndex];


    if (
      !confirm(
        `${getLabel(nextKey)}を開始しますか？`
      )
    ) {
      return;
    }


    nextButton.disabled = true;


    try {

      await startQuestion(
        nextKey
      );

    } catch (error) {

      console.error(error);

      alert(
        "問題開始に失敗しました。"
      );

    }


    nextButton.disabled = false;

  }
);


/* ==============================
   前の問題
============================== */

previousButton.addEventListener(
  "click",
  async () => {

    if (!currentQuestionKey) {

      alert(
        "現在問題がありません。"
      );

      return;

    }


    const index =
      questionOrder.indexOf(
        currentQuestionKey
      );


    if (index <= 0) {

      alert(
        "これより前の問題はありません。"
      );

      return;

    }


    const previousKey =
      questionOrder[
        index - 1
      ];


    if (
      !confirm(
        `${getLabel(previousKey)}を再スタートしますか？\n\nその問題の過去回答・得点は削除されます。`
      )
    ) {
      return;
    }


    await startQuestion(
      previousKey
    );

  }
);


/* ==============================
   得点計算
============================== */

async function calculateScores(key) {

  /*
    練習問題は得点なし
  */

  if (key === "practice") {
    return;
  }


  const correct =
    correctAnswers[key];


  if (
    correct === null ||
    correct === undefined
  ) {

    throw new Error(
      `${getLabel(key)}の正解がまだ設定されていません`
    );

  }


  const roundSnapshot =
    await get(
      ref(
        database,
        `rounds/${key}`
      )
    );


  const round =
    roundSnapshot.val();


  if (
    !round ||
    typeof round.startedAt !== "number"
  ) {

    throw new Error(
      "開始時刻がありません"
    );

  }


  const answersSnapshot =
    await get(
      ref(
        database,
        `answers/${key}`
      )
    );


  const answers =
    answersSnapshot.val() || {};


  const updates = {};


  Object.keys(teams).forEach(
    teamId => {

      const answer =
        answers[teamId];


      let points = 0;


      if (
        answer &&
        answer.choice === correct &&
        typeof answer.answeredAt === "number"
      ) {

        const elapsed =
          Math.max(
            0,
            (
              answer.answeredAt -
              round.startedAt
            ) / 1000
          );


        if (elapsed <= 45) {

          const remaining =
            Math.max(
              0,
              45 - elapsed
            );


          points =
            Math.round(
              500 +
              500 *
              (
                remaining / 45
              )
            );


          points =
            Math.min(
              1000,
              Math.max(
                500,
                points
              )
            );

        }

      }


      updates[
        `scores/${teamId}/${key}`
      ] = points;

    }
  );


  await update(
    ref(database),
    updates
  );

}


/* ==============================
   正解発表
============================== */

resultButton.addEventListener(
  "click",
  async () => {

    if (!currentQuestionKey) {

      alert(
        "出題中の問題がありません。"
      );

      return;

    }


    if (
      currentPhase === "result"
    ) {

      alert(
        "すでに正解発表済みです。"
      );

      return;

    }


    if (
      !confirm(
        `${getLabel(currentQuestionKey)}の正解を発表しますか？`
      )
    ) {
      return;
    }


    resultButton.disabled = true;

    resultButton.textContent =
      "集計中...";


    try {

      await calculateScores(
        currentQuestionKey
      );


      await set(
        ref(database, "game"),
        {
          phase: "result",
          currentQuestion:
            currentQuestionKey,

          revealedAt:
            serverTimestamp()
        }
      );


    } catch (error) {

      console.error(error);

      alert(
        error.message
      );

    }


    resultButton.disabled = false;

    resultButton.textContent =
      "正解発表・得点確定";

  }
);


/* ==============================
   待機画面
============================== */

waitingButton.addEventListener(
  "click",
  async () => {

    if (
      !confirm(
        "参加者を待機画面へ戻しますか？"
      )
    ) {
      return;
    }


    await set(
      ref(database, "game"),
      {
        phase: "waiting",
        currentQuestion: null,
        updatedAt:
          serverTimestamp()
      }
    );

  }
);


/* ==============================
   中間ランキング
============================== */

midRankingButton.addEventListener(
  "click",
  async () => {

    if (
      !confirm(
        "中間ランキングを表示しますか？"
      )
    ) {
      return;
    }


    await set(
      ref(database, "game"),
      {
        phase: "ranking",
        rankingType: "mid",
        updatedAt:
          serverTimestamp()
      }
    );

  }
);


/* ==============================
   最終ランキング
============================== */

finalRankingButton.addEventListener(
  "click",
  async () => {

    if (
      !confirm(
        "最終ランキングへ進みますか？"
      )
    ) {
      return;
    }


    await set(
      ref(database, "game"),
      {
        phase: "final",
        rankingType: "final",
        finalRevealRank: 5,
        updatedAt:
          serverTimestamp()
      }
    );

  }
);


/* ==============================
   全リセット
============================== */

resetButton.addEventListener(
  "click",
  async () => {

    const input =
      prompt(
        "全テストデータを削除します。\n\nRESET と入力してください。"
      );


    if (
      input !== "RESET"
    ) {

      alert(
        "削除をキャンセルしました。"
      );

      return;

    }


    if (
      !confirm(
        "本当にすべて削除しますか？"
      )
    ) {
      return;
    }


    resetButton.disabled = true;

    resetButton.textContent =
      "削除中...";


    try {

      await Promise.all([

        remove(
          ref(database, "teams")
        ),

        remove(
          ref(database, "answers")
        ),

        remove(
          ref(database, "scores")
        ),

        remove(
          ref(database, "rounds")
        )

      ]);


      await set(
        ref(database, "game"),
        {
          phase: "waiting",
          currentQuestion: null,
          updatedAt:
            serverTimestamp()
        }
      );


      alert(
        "テストデータを削除しました！"
      );


    } catch (error) {

      console.error(error);

      alert(
        "削除に失敗しました。"
      );

    }


    resetButton.disabled = false;

    resetButton.textContent =
      "テストデータを全削除";

  }
);

</script>

</body>
</html>
