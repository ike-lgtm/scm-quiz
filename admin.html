<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SCM QUIZ 運営画面</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f4f5f7;
      color: #222;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    h1 {
      margin-bottom: 6px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 30px;
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 24px;
    }

    .stat {
      background: white;
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 5px 20px rgba(0,0,0,.06);
    }

    .stat-label {
      color: #666;
      font-size: 14px;
    }

    .stat-number {
      font-size: 42px;
      font-weight: bold;
      margin-top: 6px;
    }

    .panel {
      background: white;
      border-radius: 18px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 5px 20px rgba(0,0,0,.06);
    }

    .start-button {
      width: 100%;
      padding: 20px;
      border: none;
      border-radius: 14px;
      background: #222;
      color: white;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
    }

    .status {
      margin-top: 14px;
      text-align: center;
      font-weight: bold;
    }

    .team-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 10px;
      margin-top: 16px;
    }

    .team {
      background: #f4f5f7;
      border-radius: 10px;
      padding: 12px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>SCM QUIZ 運営画面</h1>
  <div class="subtitle">
    参加状況・クイズ進行管理
  </div>

  <div class="stats">

    <div class="stat">
      <div class="stat-label">参加チーム</div>
      <div class="stat-number">
        <span id="teamCount">0</span>
      </div>
    </div>

    <div class="stat">
      <div class="stat-label">Q1 回答済み</div>
      <div class="stat-number">
        <span id="answerCount">0</span>
      </div>
    </div>

  </div>

  <div class="panel">

    <h2>クイズ操作</h2>

    <button
      class="start-button"
      id="startQ1"
    >
      Q1を開始
    </button>

    <div
      class="status"
      id="quizStatus"
    >
      現在：待機中
    </div>

  </div>

  <div class="panel">

    <h2>参加チーム一覧</h2>

    <div
      class="team-list"
      id="teamList"
    ></div>

  </div>

</div>


<script type="module">

  import { initializeApp }
  from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

  import {
    getDatabase,
    ref,
    onValue,
    set
  }
  from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";


  const firebaseConfig = {
    apiKey: "AIzaSyAVazxROYpygBw0xMhJlhbvrAaF1pmicEc",
    authDomain: "scm-quiz-df0e6.firebaseapp.com",
    databaseURL: "https://scm-quiz-df0e6-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "scm-quiz-df0e6",
    storageBucket: "scm-quiz-df0e6.firebasestorage.app",
    messagingSenderId: "30616205850",
    appId: "1:30616205850:web:224b6386ee807700d26fa3"
  };


  const app = initializeApp(firebaseConfig);
  const database = getDatabase(app);


  // 参加チーム監視
  onValue(
    ref(database, "teams"),
    (snapshot) => {

      const teams = snapshot.val() || {};

      const teamArray =
        Object.values(teams);

      document.getElementById(
        "teamCount"
      ).textContent = teamArray.length;

      const list =
        document.getElementById("teamList");

      list.innerHTML = "";

      teamArray.forEach(team => {

        const div =
          document.createElement("div");

        div.className = "team";

        div.textContent = team.name;

        list.appendChild(div);
      });
    }
  );


  // Q1回答数監視
  onValue(
    ref(database, "answers/q1"),
    (snapshot) => {

      const answers =
        snapshot.val() || {};

      document.getElementById(
        "answerCount"
      ).textContent =
        Object.keys(answers).length;
    }
  );


  // クイズ状態監視
  onValue(
    ref(database, "game"),
    (snapshot) => {

      const game =
        snapshot.val();

      if (!game) return;

      if (game.status === "question") {

        document.getElementById(
          "quizStatus"
        ).textContent =
          "現在：Q" +
          game.question +
          " 出題中";

      } else {

        document.getElementById(
          "quizStatus"
        ).textContent =
          "現在：待機中";
      }
    }
  );


  // Q1開始
  document.getElementById(
    "startQ1"
  ).addEventListener(
    "click",
    async () => {

      const ok =
        confirm(
          "全チームにQ1を開始します。よろしいですか？"
        );

      if (!ok) return;

      await set(
        ref(database, "game"),
        {
          status: "question",
          question: 1,
          startedAt: Date.now()
        }
      );
    }
  );

</script>

</body>
</html>
