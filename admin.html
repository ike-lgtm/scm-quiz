<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SCM QUIZ 運営画面</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    .container {
      width: min(94%, 900px);
      margin: 0 auto;
      padding: 30px 0 60px;
    }

    h1 {
      margin-bottom: 6px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 25px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 22px;
      margin-bottom: 18px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.07);
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    .stat {
      background: #f7f7f7;
      border-radius: 12px;
      padding: 18px;
      text-align: center;
    }

    .stat-label {
      font-size: 14px;
      color: #666;
      margin-bottom: 5px;
    }

    .stat-number {
      font-size: 34px;
      font-weight: bold;
    }

    .status {
      font-size: 22px;
      font-weight: bold;
      margin-top: 8px;
    }

    .button-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 16px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.88;
    }

    .primary {
      background: #222;
      color: white;
    }

    .secondary {
      background: #e9edf2;
      color: #222;
    }

    .result {
      background: #e7f3ff;
      color: #075985;
    }

    .danger {
      background: #b42318;
      color: white;
    }

    .danger-zone {
      border: 2px solid #ffd4d0;
    }

    .team-list,
    .answer-list {
      margin-top: 15px;
      display: grid;
      gap: 8px;
    }

    .team-item,
    .answer-item {
      padding: 10px 12px;
      background: #f7f7f7;
      border-radius: 8px;
    }

    .notice {
      font-size: 13px;
      color: #777;
      line-height: 1.6;
    }

    @media (max-width: 600px) {
      .button-grid,
      .stats {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <h1>SCM QUIZ 運営画面</h1>

  <div class="subtitle">
    参加状況・クイズ進行管理
  </div>


  <!-- 現在の状態 -->
  <div class="card">

    <h2>現在の状態</h2>

    <div id="gameStatus" class="status">
      読み込み中...
    </div>

  </div>


  <!-- 集計 -->
  <div class="card">

    <div class="stats">

      <div class="stat">

        <div class="stat-label">
          参加チーム
        </div>

        <div id="teamCount" class="stat-number">
          0
        </div>

      </div>


      <div class="stat">

        <div class="stat-label">
          現在の問題 回答済み
        </div>

        <div id="answerCount" class="stat-number">
          0
        </div>

      </div>

    </div>

  </div>


  <!-- クイズ操作 -->
  <div class="card">

    <h2>クイズ操作</h2>

    <div class="button-grid">

      <button
        id="waitingButton"
        class="secondary">
        待機画面に戻す
      </button>


      <button
        id="practiceButton"
        class="primary">
        練習問題を開始
      </button>


      <button
        id="resultButton"
        class="result">
        正解を発表
      </button>


      <button
        id="q1Button"
        class="primary">
        Q1を開始
      </button>

    </div>

    <p class="notice">
      現在は動作確認のため、練習問題とQ1まで操作できます。
      動作確認後にQ2〜Q10、中間ランキング、最終ランキングを追加します。
    </p>

  </div>


  <!-- 回答状況 -->
  <div class="card">

    <h2>現在の問題の回答状況</h2>

    <div id="answerList" class="answer-list">
      まだ回答はありません
    </div>

  </div>


  <!-- チーム -->
  <div class="card">

    <h2>参加チーム一覧</h2>

    <div id="teamList" class="team-list">
      まだ参加チームはありません
    </div>

  </div>


  <!-- リセット -->
  <div class="card danger-zone">

    <h2>テスト用リセット</h2>

    <p>
      参加チーム・回答・得点・現在の進行状態を
      すべて削除します。
    </p>

    <button
      id="resetButton"
      class="danger">
      テストデータを全削除
    </button>

    <p class="notice">
      ※本番開始後は押さないでください。
    </p>

  </div>

</div>


<script type="module">

import {
  initializeApp
}
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";


import {
  getDatabase,
  ref,
  onValue,
  set,
  remove,
  serverTimestamp
}
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";


const firebaseConfig = {

  apiKey:
    "AIzaSyAVazxROYpygBw0xMhJlhbvrAaF1pmicEc",

  authDomain:
    "scm-quiz-df0e6.firebaseapp.com",

  databaseURL:
    "https://scm-quiz-df0e6-default-rtdb.asia-southeast1.firebasedatabase.app",

  projectId:
    "scm-quiz-df0e6",

  storageBucket:
    "scm-quiz-df0e6.firebasestorage.app",

  messagingSenderId:
    "30616205850",

  appId:
    "1:30616205850:web:224b6386ee807700d26fa3"
};


const app =
  initializeApp(firebaseConfig);

const database =
  getDatabase(app);


/* =========================
   DOM
========================= */

const teamCount =
  document.getElementById("teamCount");

const answerCount =
  document.getElementById("answerCount");

const gameStatus =
  document.getElementById("gameStatus");

const teamList =
  document.getElementById("teamList");

const answerList =
  document.getElementById("answerList");

const waitingButton =
  document.getElementById("waitingButton");

const practiceButton =
  document.getElementById("practiceButton");

const resultButton =
  document.getElementById("resultButton");

const q1Button =
  document.getElementById("q1Button");

const resetButton =
  document.getElementById("resetButton");


let currentQuestion = null;

let unsubscribeAnswers = null;


/* =========================
   TEAM LIST
========================= */

onValue(
  ref(database, "teams"),
  snapshot => {

    const teams =
      snapshot.val() || {};

    const teamArray =
      Object.entries(teams);


    teamCount.textContent =
      teamArray.length;


    teamList.innerHTML = "";


    if (teamArray.length === 0) {

      teamList.textContent =
        "まだ参加チームはありません";

      return;
    }


    teamArray.forEach(
      ([id, team], index) => {

        const div =
          document.createElement("div");

        div.className =
          "team-item";

        div.textContent =
          `${index + 1}. ${team.name}`;

        teamList.appendChild(div);

      }
    );

  }
);


/* =========================
   GAME
========================= */

onValue(
  ref(database, "game"),
  snapshot => {

    const game =
      snapshot.val();


    if (!game) {

      currentQuestion = null;

      gameStatus.textContent =
        "待機中";

      watchAnswers(null);

      return;
    }


    currentQuestion =
      game.currentQuestion || null;


    if (game.phase === "waiting") {

      gameStatus.textContent =
        "待機中";

      watchAnswers(null);

      return;
    }


    const label =
      currentQuestion === "practice"
        ? "練習問題"
        : currentQuestion
          ? currentQuestion.toUpperCase()
          : "";


    if (game.phase === "question") {

      gameStatus.textContent =
        `${label} 出題中`;

      watchAnswers(currentQuestion);

      return;
    }


    if (game.phase === "result") {

      gameStatus.textContent =
        `${label} 正解発表中`;

      watchAnswers(currentQuestion);

    }

  }
);


/* =========================
   ANSWERS
========================= */

function watchAnswers(questionKey) {

  if (unsubscribeAnswers) {

    unsubscribeAnswers();

    unsubscribeAnswers = null;

  }


  if (!questionKey) {

    answerCount.textContent = "0";

    answerList.textContent =
      "まだ回答はありません";

    return;
  }


  unsubscribeAnswers =
    onValue(
      ref(
        database,
        `answers/${questionKey}`
      ),

      snapshot => {

        const answers =
          snapshot.val() || {};

        const answerArray =
          Object.values(answers);


        answerCount.textContent =
          answerArray.length;


        answerList.innerHTML = "";


        if (answerArray.length === 0) {

          answerList.textContent =
            "まだ回答はありません";

          return;
        }


        const letters =
          ["A", "B", "C", "D"];


        answerArray.forEach(
          answer => {

            const div =
              document.createElement("div");

            div.className =
              "answer-item";


            const letter =
              letters[answer.choice] ?? "-";


            div.textContent =
              `${answer.teamName}：${letter}`;


            answerList.appendChild(div);

          }
        );

      }
    );

}


/* =========================
   WAITING
========================= */

waitingButton.addEventListener(
  "click",
  async () => {

    const ok =
      confirm(
        "参加者の画面を待機状態に戻しますか？"
      );

    if (!ok) return;


    await set(
      ref(database, "game"),
      {

        phase: "waiting",

        currentQuestion: null,

        updatedAt:
          serverTimestamp()

      }
    );

  }
);


/* =========================
   PRACTICE
========================= */

practiceButton.addEventListener(
  "click",
  async () => {

    const ok =
      confirm(
        "練習問題を開始しますか？"
      );

    if (!ok) return;


    await set(
      ref(database, "game"),
      {

        phase: "question",

        currentQuestion:
          "practice",

        startedAt:
          serverTimestamp()

      }
    );

  }
);


/* =========================
   RESULT
========================= */

resultButton.addEventListener(
  "click",
  async () => {

    if (!currentQuestion) {

      alert(
        "出題中の問題がありません"
      );

      return;
    }


    const ok =
      confirm(
        "正解を発表しますか？"
      );

    if (!ok) return;


    await set(
      ref(database, "game"),
      {

        phase: "result",

        currentQuestion:
          currentQuestion,

        revealedAt:
          serverTimestamp()

      }
    );

  }
);


/* =========================
   Q1
========================= */

q1Button.addEventListener(
  "click",
  async () => {

    const ok =
      confirm(
        "Q1を開始しますか？"
      );

    if (!ok) return;


    await set(
      ref(database, "game"),
      {

        phase: "question",

        currentQuestion:
          "q1",

        startedAt:
          serverTimestamp()

      }
    );

  }
);


/* =========================
   RESET
========================= */

resetButton.addEventListener(
  "click",
  async () => {

    const input =
      prompt(
        "全テストデータを削除します。\n\n削除する場合は RESET と入力してください。"
      );


    if (input !== "RESET") {

      alert(
        "削除をキャンセルしました。"
      );

      return;
    }


    const finalCheck =
      confirm(
        "本当に削除しますか？\n\n参加チーム・回答・得点がすべて削除されます。"
      );


    if (!finalCheck) return;


    resetButton.disabled = true;

    resetButton.textContent =
      "削除中...";


    try {

      await Promise.all([

        remove(
          ref(database, "teams")
        ),

        remove(
          ref(database, "answers")
        ),

        remove(
          ref(database, "scores")
        )

      ]);


      await set(
        ref(database, "game"),
        {

          phase: "waiting",

          currentQuestion: null,

          updatedAt:
            serverTimestamp()

        }
      );


      alert(
        "テストデータを削除しました！"
      );


    } catch (error) {

      console.error(error);

      alert(
        "削除に失敗しました。"
      );

    }


    resetButton.disabled = false;

    resetButton.textContent =
      "テストデータを全削除";

  }
);

</script>

</body>
</html>
