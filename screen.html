<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SCM QUIZ SCREEN</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #111827;
      color: white;
      overflow-x: hidden;
    }

    .screen {
      min-height: 100vh;
      padding: 4vh 5vw;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .hidden {
      display: none !important;
    }

    /* =========================
       待機
    ========================= */

    .waiting {
      text-align: center;
    }

    .logo {
      font-size: clamp(52px, 8vw, 110px);
      font-weight: 900;
      letter-spacing: .04em;
      margin-bottom: 20px;
    }

    .waiting-sub {
      font-size: clamp(22px, 3vw, 42px);
      font-weight: bold;
    }

    .waiting-message {
      margin-top: 30px;
      font-size: clamp(18px, 2vw, 30px);
      opacity: .7;
    }


    /* =========================
       問題
    ========================= */

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 30px;
      margin-bottom: 24px;
    }

    .question-label {
      font-size: clamp(28px, 4vw, 58px);
      font-weight: 900;
    }

    .timer-box {
      text-align: center;
      min-width: 150px;
    }

    .timer-caption {
      font-size: 16px;
      opacity: .7;
    }

    .timer {
      font-size: clamp(48px, 6vw, 82px);
      line-height: 1;
      font-weight: 900;
    }

    .question-text {
      font-size: clamp(28px, 4vw, 58px);
      line-height: 1.35;
      font-weight: 800;
      margin-bottom: 28px;
    }

    .question-images {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      margin: 0 auto 28px;
      width: 100%;
    }

    .question-images img {
      max-width: 46%;
      max-height: 32vh;
      object-fit: contain;
      border-radius: 14px;
      background: white;
    }

    .choices {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .choice {
      background: rgba(255,255,255,.1);
      border: 2px solid rgba(255,255,255,.15);
      border-radius: 16px;
      padding: 20px 24px;
      font-size: clamp(20px, 2.2vw, 32px);
      font-weight: bold;
    }

    .answer-counter {
      margin-top: 22px;
      text-align: right;
      font-size: clamp(18px, 2vw, 28px);
      opacity: .8;
    }


    /* =========================
       正解発表
    ========================= */

    .result-title {
      text-align: center;
      font-size: clamp(32px, 5vw, 70px);
      font-weight: 900;
      margin-bottom: 20px;
    }

    .correct-answer {
      text-align: center;
      font-size: clamp(26px, 3.5vw, 52px);
      font-weight: 900;
      margin-bottom: 28px;
    }

    .result-layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 32px;
      align-items: start;
    }

    .panel {
      background: rgba(255,255,255,.08);
      border-radius: 18px;
      padding: 24px;
    }

    .panel-title {
      font-size: clamp(20px, 2.3vw, 32px);
      font-weight: 900;
      margin-bottom: 20px;
    }

    .distribution-row {
      display: grid;
      grid-template-columns: 45px 1fr 70px;
      gap: 12px;
      align-items: center;
      margin: 16px 0;
      font-size: clamp(18px, 2vw, 27px);
    }

    .bar-bg {
      height: 28px;
      background: rgba(255,255,255,.12);
      border-radius: 999px;
      overflow: hidden;
    }

    .bar {
      height: 100%;
      background: white;
      border-radius: 999px;
      transition: width .6s ease;
    }

    .explanation {
      font-size: clamp(18px, 1.8vw, 27px);
      line-height: 1.7;
      white-space: pre-line;
    }


    /* =========================
       ランキング
    ========================= */

    .ranking-title {
      text-align: center;
      font-size: clamp(42px, 6vw, 82px);
      font-weight: 900;
      margin-bottom: 30px;
    }

    .ranking-list {
      width: min(100%, 1100px);
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px 28px;
    }

    .rank-row {
      display: grid;
      grid-template-columns: 85px 1fr auto;
      align-items: center;
      background: rgba(255,255,255,.1);
      border-radius: 12px;
      padding: 10px 18px;
      font-size: clamp(16px, 1.6vw, 23px);
    }

    .rank-number {
      font-weight: 900;
    }

    .rank-name {
      font-weight: bold;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .rank-score {
      font-weight: 900;
      margin-left: 12px;
    }

    @media(max-width: 800px) {
      .choices,
      .result-layout,
      .ranking-list {
        grid-template-columns: 1fr;
      }

      .question-images img {
        max-width: 48%;
      }
    }
  </style>
</head>

<body>

<!-- 待機 -->
<section id="waitingScreen" class="screen waiting">

  <div class="logo">
    SCM QUIZ
  </div>

  <div class="waiting-sub">
    部署横断！チーム対抗クイズ
  </div>

  <div class="waiting-message">
    まもなくスタートします
  </div>

</section>


<!-- 問題 -->
<section id="questionScreen" class="screen hidden">

  <div class="top-bar">

    <div id="questionLabel" class="question-label">
      Q1
    </div>

    <div class="timer-box">
      <div class="timer-caption">
        残り時間
      </div>

      <div id="timer" class="timer">
        45
      </div>
    </div>

  </div>


  <div id="questionText" class="question-text"></div>


  <div id="questionImages" class="question-images"></div>


  <div id="choices" class="choices"></div>


  <div id="answerCounter" class="answer-counter">
    回答 0 / 0 チーム
  </div>

</section>


<!-- 正解発表 -->
<section id="resultScreen" class="screen hidden">

  <div class="result-title">
    正解発表！
  </div>

  <div id="correctAnswer" class="correct-answer"></div>


  <div class="result-layout">

    <div class="panel">

      <div class="panel-title">
        回答結果
      </div>

      <div id="distribution"></div>

    </div>


    <div class="panel">

      <div class="panel-title">
        解説
      </div>

      <div id="explanation" class="explanation"></div>

    </div>

  </div>

</section>


<!-- 中間ランキング -->
<section id="rankingScreen" class="screen hidden">

  <div class="ranking-title">
    🏆 中間ランキング 🏆
  </div>

  <div id="rankingList" class="ranking-list"></div>

</section>


<!-- 最終ランキング仮画面 -->
<section id="finalScreen" class="screen waiting hidden">

  <div class="logo">
    FINAL
  </div>

  <div class="waiting-sub">
    最終結果発表
  </div>

  <div class="waiting-message">
    最終ランキングを発表します
  </div>

</section>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
  getDatabase,
  ref,
  onValue
}
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";


const firebaseConfig = {
  apiKey: "AIzaSyAVazxROYpygBw0xMhJlhbvrAaF1pmicEc",
  authDomain: "scm-quiz-df0e6.firebaseapp.com",
  databaseURL: "https://scm-quiz-df0e6-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "scm-quiz-df0e6",
  storageBucket: "scm-quiz-df0e6.firebasestorage.app",
  messagingSenderId: "30616205850",
  appId: "1:30616205850:web:224b6386ee807700d26fa3"
};

const app = initializeApp(firebaseConfig);
const database = getDatabase(app);


/* =====================================
   問題データ
===================================== */

const questions = {

  practice: {
    label: "練習問題",
    text: "習志野拠点の最寄り駅は？",
    choices: [
      "南船橋駅",
      "幕張豊砂駅",
      "新習志野駅",
      "新浦安駅"
    ],
    correct: 1,
    images: [],
    explanation:
      "練習問題です！\n本番も同じ流れで回答してください。"
  },


  q1: {
    label: "Q1",
    text:
      "船橋・習志野を足したロジ面積数（㎡）は？ちなみに1坪は3.30578㎡です。",
    choices: [
      "約18,843㎡",
      "約19,112㎡",
      "約20,896㎡",
      "約17,456㎡"
    ],
    correct: 0,
    images: [],
    explanation:
      "船橋 3,300坪 → 約10,909㎡\n習志野 2,400坪 → 約7,934㎡\n\n合計：約18,843㎡"
  },


  q2: {
    label: "Q2",
    text:
      "勤続年数が一番長いPAがいるチームはどこ？",
    choices: [
      "販売1部 販売1G",
      "販売1部 販売3G",
      "toC販売部 出品管理G",
      "物流管理部 千葉物流管理G"
    ],
    correct: 0,
    images: [],
    explanation:
      "販売1部 販売1GのPAさんは11年5ヶ月！\n\n査定研修部 査定2Gと販売2部にも、同じ在籍数の方が1名ずついます！"
  },


  q3: {
    label: "Q3",
    text:
      "上半期バイセルALL（グループ含む）総買取点数は？ ※バーコード点数",
    choices: [
      "準備中",
      "準備中",
      "準備中",
      "準備中"
    ],
    correct: null,
    images: [],
    explanation: "準備中"
  },


  q4: {
    label: "Q4",
    text:
      "現在（10月1日）の貴金属相場1gの相場は？",
    choices: [
      "準備中",
      "準備中",
      "準備中",
      "準備中"
    ],
    correct: null,
    images: [],
    explanation: "準備中"
  },


  q5: {
    label: "Q5",
    text:
      "ルイ・ヴィトンのモノグラム柄やダミエ柄は、ある国の伝統的な文様から着想を得て生まれました。その国はどこでしょうか？",
    choices: [
      "イタリア",
      "フランス",
      "ドイツ",
      "日本"
    ],
    correct: 3,
    images: [],
    explanation:
      "19世紀後半のヨーロッパでは、日本美術やデザインの影響を受けた「ジャポニスム」が広がりました。\nルイ・ヴィトンのデザインも、日本文化との関連が語られています。"
  },


  q6: {
    label: "Q6",
    text:
      "【NJ】アレキサンドライトの特徴である「変色効果（カラーチェンジ）」を引き起こす主な微量元素は何でしょうか？",
    choices: [
      "準備中",
      "準備中",
      "準備中",
      "準備中"
    ],
    correct: null,
    images: [],
    explanation: "準備中"
  },


  q7: {
    label: "Q7",
    text:
      "【骨董】高い順に並べてください",
    choices: [
      "準備中",
      "準備中",
      "準備中",
      "準備中"
    ],
    correct: null,
    images: [],
    explanation: "準備中"
  },


  q8: {
    label: "Q8",
    text: "準備中",
    choices: [
      "準備中",
      "準備中",
      "準備中",
      "準備中"
    ],
    correct: null,
    images: [],
    explanation: "準備中"
  },


  q9: {
    label: "Q9",
    text: "準備中",
    choices: [
      "準備中",
      "準備中",
      "準備中",
      "準備中"
    ],
    correct: null,
    images: [],
    explanation: "準備中"
  },


  q10: {
    label: "Q10",
    text:
      "徳重社長がトップメッセージで紹介している絵の名前は？",
    choices: [
      "準備中",
      "準備中",
      "準備中",
      "準備中"
    ],
    correct: null,
    images: [],
    explanation: "準備中"
  }

};


/* =====================================
   DOM
===================================== */

const waitingScreen =
  document.getElementById("waitingScreen");

const questionScreen =
  document.getElementById("questionScreen");

const resultScreen =
  document.getElementById("resultScreen");

const rankingScreen =
  document.getElementById("rankingScreen");

const finalScreen =
  document.getElementById("finalScreen");


const questionLabel =
  document.getElementById("questionLabel");

const questionText =
  document.getElementById("questionText");

const questionImages =
  document.getElementById("questionImages");

const choicesElement =
  document.getElementById("choices");

const timer =
  document.getElementById("timer");

const answerCounter =
  document.getElementById("answerCounter");

const correctAnswer =
  document.getElementById("correctAnswer");

const distribution =
  document.getElementById("distribution");

const explanation =
  document.getElementById("explanation");

const rankingList =
  document.getElementById("rankingList");


let teams = {};
let answers = {};
let scores = {};

let currentQuestionKey = null;
let currentStartedAt = null;

let timerInterval = null;
let unsubscribeAnswers = null;


/* =====================================
   画面切替
===================================== */

function showScreen(screen) {

  [
    waitingScreen,
    questionScreen,
    resultScreen,
    rankingScreen,
    finalScreen
  ].forEach(element => {
    element.classList.add("hidden");
  });

  screen.classList.remove("hidden");

}


/* =====================================
   チーム監視
===================================== */

onValue(
  ref(database, "teams"),
  snapshot => {

    teams =
      snapshot.val() || {};

    updateAnswerCounter();

  }
);


/* =====================================
   得点監視
===================================== */

onValue(
  ref(database, "scores"),
  snapshot => {

    scores =
      snapshot.val() || {};

    renderRanking();

  }
);


/* =====================================
   GAME監視
===================================== */

onValue(
  ref(database, "game"),

  snapshot => {

    const game =
      snapshot.val();


    if (!game) {

      showScreen(waitingScreen);
      return;

    }


    if (game.phase === "waiting") {

      clearInterval(timerInterval);

      stopAnswerWatcher();

      showScreen(waitingScreen);

      return;

    }


    if (game.phase === "question") {

      currentQuestionKey =
        game.currentQuestion;

      currentStartedAt =
        game.startedAt || null;

      renderQuestion(
        currentQuestionKey
      );

      watchAnswers(
        currentQuestionKey
      );

      startSyncedTimer(
        currentStartedAt
      );

      showScreen(
        questionScreen
      );

      return;

    }


    if (game.phase === "result") {

      clearInterval(timerInterval);

      currentQuestionKey =
        game.currentQuestion;

      watchAnswers(
        currentQuestionKey
      );

      renderResult(
        currentQuestionKey
      );

      showScreen(
        resultScreen
      );

      return;

    }


    if (game.phase === "ranking") {

      clearInterval(timerInterval);

      stopAnswerWatcher();

      renderRanking();

      showScreen(
        rankingScreen
      );

      return;

    }


    if (game.phase === "final") {

      clearInterval(timerInterval);

      stopAnswerWatcher();

      showScreen(
        finalScreen
      );

    }

  }
);


/* =====================================
   問題表示
===================================== */

function renderQuestion(key) {

  const question =
    questions[key];


  if (!question) {
    return;
  }


  questionLabel.textContent =
    question.label;

  questionText.textContent =
    question.text;


  questionImages.innerHTML = "";


  if (
    question.images &&
    question.images.length > 0
  ) {

    question.images.forEach(src => {

      const img =
        document.createElement("img");

      img.src = src;

      questionImages.appendChild(img);

    });

  }


  choicesElement.innerHTML = "";


  const letters =
    ["A","B","C","D"];


  question.choices.forEach(
    (choice, index) => {

      const div =
        document.createElement("div");

      div.className =
        "choice";

      div.textContent =
        `${letters[index]}：${choice}`;

      choicesElement.appendChild(div);

    }
  );

}


/* =====================================
   回答監視
===================================== */

function stopAnswerWatcher() {

  if (unsubscribeAnswers) {

    unsubscribeAnswers();

    unsubscribeAnswers = null;

  }

  answers = {};

}


function watchAnswers(key) {

  stopAnswerWatcher();


  unsubscribeAnswers =
    onValue(

      ref(
        database,
        `answers/${key}`
      ),

      snapshot => {

        answers =
          snapshot.val() || {};

        updateAnswerCounter();


        /*
          正解発表中なら
          回答分布も更新
        */

        renderDistribution(
          key
        );

      }

    );

}


function updateAnswerCounter() {

  const total =
    Object.keys(teams).length;

  const answered =
    Object.keys(answers).length;


  answerCounter.textContent =
    `回答 ${answered} / ${total} チーム`;

}


/* =====================================
   同期タイマー

   adminが保存したstartedAtを基準にする
===================================== */

function startSyncedTimer(startedAt) {

  clearInterval(timerInterval);


  function updateTimer() {

    if (
      typeof startedAt !== "number"
    ) {

      timer.textContent =
        "45";

      return;

    }


    const elapsed =
      (Date.now() - startedAt) / 1000;


    const remaining =
      Math.max(
        0,
        Math.ceil(
          45 - elapsed
        )
      );


    timer.textContent =
      remaining;


    if (
      remaining <= 0
    ) {

      clearInterval(
        timerInterval
      );

    }

  }


  updateTimer();


  timerInterval =
    setInterval(
      updateTimer,
      250
    );

}


/* =====================================
   正解発表
===================================== */

function renderResult(key) {

  const question =
    questions[key];


  if (!question) {
    return;
  }


  const letters =
    ["A","B","C","D"];


  if (
    question.correct !== null
  ) {

    correctAnswer.textContent =
      `正解：${letters[question.correct]}：${question.choices[question.correct]}`;

  } else {

    correctAnswer.textContent =
      "正解準備中";

  }


  explanation.textContent =
    question.explanation ||
    "";


  renderDistribution(
    key
  );

}


/* =====================================
   回答分布
===================================== */

function renderDistribution(key) {

  const question =
    questions[key];


  if (!question) {
    return;
  }


  const counts =
    [0,0,0,0];


  Object.values(answers)
    .forEach(answer => {

      if (
        Number.isInteger(
          answer.choice
        ) &&
        answer.choice >= 0 &&
        answer.choice <= 3
      ) {

        counts[
          answer.choice
        ]++;

      }

    });


  const max =
    Math.max(
      1,
      ...counts
    );


  const letters =
    ["A","B","C","D"];


  distribution.innerHTML = "";


  counts.forEach(
    (count, index) => {

      const row =
        document.createElement("div");

      row.className =
        "distribution-row";


      const width =
        (count / max) * 100;


      row.innerHTML = `
        <strong>${letters[index]}</strong>

        <div class="bar-bg">
          <div
            class="bar"
            style="width:${width}%;">
          </div>
        </div>

        <strong>${count}</strong>
      `;


      distribution.appendChild(
        row
      );

    }
  );

}


/* =====================================
   ランキング
===================================== */

function renderRanking() {

  if (!rankingList) {
    return;
  }


  const ranking =
    Object.entries(teams)
      .map(([teamId, team]) => {

        const teamScores =
          scores[teamId] || {};


        const total =
          Object.values(teamScores)
            .reduce(
              (sum, value) =>
                sum + Number(value || 0),
              0
            );


        return {
          name: team.name,
          total
        };

      });


  ranking.sort(
    (a,b) =>
      b.total - a.total
  );


  rankingList.innerHTML = "";


  ranking.forEach(
    (team, index) => {

      const row =
        document.createElement("div");

      row.className =
        "rank-row";


      row.innerHTML = `
        <div class="rank-number">
          ${index + 1}位
        </div>

        <div class="rank-name">
          ${escapeHtml(team.name)}
        </div>

        <div class="rank-score">
          ${team.total.toLocaleString()} pt
        </div>
      `;


      rankingList.appendChild(
        row
      );

    }
  );

}


/* =====================================
   HTMLエスケープ
===================================== */

function escapeHtml(value) {

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}

</script>

</body>
</html>
