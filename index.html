<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SCM QUIZ</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f4f5f7;
      color: #222;
    }

    .screen {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 520px;
      background: white;
      border-radius: 24px;
      padding: 36px 24px;
      text-align: center;
      box-shadow: 0 10px 35px rgba(0,0,0,0.10);
    }

    h1 {
      font-size: 42px;
      margin: 0 0 8px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 36px;
    }

    .label {
      display: block;
      text-align: left;
      font-weight: bold;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 16px;
      font-size: 18px;
      border: 2px solid #ddd;
      border-radius: 12px;
      margin-bottom: 16px;
    }

    button { cursor: pointer; }

    .main-button {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 12px;
      font-size: 18px;
      font-weight: bold;
      background: #222;
      color: white;
    }

    .main-button:disabled {
      opacity: .5;
      cursor: default;
    }

    #waitingScreen,
    #quizScreen,
    #answeredScreen {
      display: none;
    }

    .team-name {
      font-size: 28px;
      font-weight: bold;
      margin: 20px 0;
    }

    .waiting-text {
      color: #666;
      line-height: 1.8;
      margin-bottom: 28px;
    }

    .quiz-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .question-number {
      font-weight: bold;
      font-size: 18px;
    }

    .timer {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: #222;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 26px;
      font-weight: bold;
    }

    .question {
      font-size: 24px;
      line-height: 1.5;
      font-weight: bold;
      margin: 20px 0 30px;
    }

    .answers {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .answer {
      min-height: 100px;
      border: none;
      border-radius: 16px;
      color: white;
      font-size: 18px;
      font-weight: bold;
      padding: 14px;
    }

    .answer-a { background: #d83b3b; }
    .answer-b { background: #2878c8; }
    .answer-c { background: #d49b16; }
    .answer-d { background: #32965d; }

    .answer-letter {
      display: block;
      font-size: 26px;
      margin-bottom: 6px;
    }

    .check {
      font-size: 60px;
      margin-bottom: 10px;
    }

    .selected-answer {
      margin-top: 24px;
      padding: 16px;
      background: #f4f5f7;
      border-radius: 12px;
      font-weight: bold;
    }

    .small-text {
      color: #777;
      font-size: 14px;
      margin-top: 20px;
    }
  </style>
</head>

<body>

  <!-- チーム参加 -->
  <div class="screen" id="joinScreen">
    <div class="card">

      <h1>SCM QUIZ</h1>

      <p class="subtitle">
        第一回 部署横断！チーム対抗クイズ！
      </p>

      <label class="label">チーム名</label>

      <input
        type="text"
        id="teamName"
        placeholder="チーム名を入力してください"
        maxlength="20"
      >

      <button
        class="main-button"
        id="joinButton"
      >
        クイズに参加する
      </button>

    </div>
  </div>


  <!-- 待機 -->
  <div class="screen" id="waitingScreen">
    <div class="card">

      <p>あなたのチーム</p>

      <div
        class="team-name"
        id="displayTeamName"
      ></div>

      <h2>参加完了！</h2>

      <p class="waiting-text">
        クイズ開始まで<br>
        そのままお待ちください。
      </p>

      <button
        class="main-button"
        id="testStartButton"
      >
        テスト問題を開始
      </button>

      <p class="small-text">
        ※現在は動作確認用です
      </p>

    </div>
  </div>


  <!-- クイズ -->
  <div class="screen" id="quizScreen">
    <div class="card">

      <div class="quiz-header">

        <div class="question-number">
          Q1
        </div>

        <div class="timer" id="timer">
          45
        </div>

      </div>

      <div class="question">
        SCM QUIZの制限時間は？
      </div>

      <div class="answers">

        <button class="answer answer-a"
          data-letter="A"
          data-text="15秒">
          <span class="answer-letter">A</span>
          15秒
        </button>

        <button class="answer answer-b"
          data-letter="B"
          data-text="30秒">
          <span class="answer-letter">B</span>
          30秒
        </button>

        <button class="answer answer-c"
          data-letter="C"
          data-text="45秒">
          <span class="answer-letter">C</span>
          45秒
        </button>

        <button class="answer answer-d"
          data-letter="D"
          data-text="60秒">
          <span class="answer-letter">D</span>
          60秒
        </button>

      </div>

    </div>
  </div>


  <!-- 回答完了 -->
  <div class="screen" id="answeredScreen">
    <div class="card">

      <div class="check">✓</div>

      <h2>回答完了！</h2>

      <p>回答を受け付けました。</p>

      <div
        class="selected-answer"
        id="selectedAnswer"
      ></div>

      <p class="waiting-text">
        次の問題まで<br>
        そのままお待ちください。
      </p>

    </div>
  </div>


  <script type="module">

    import { initializeApp }
    from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

    import {
      getDatabase,
      ref,
      push,
      set
    }
    from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";


    const firebaseConfig = {
      apiKey: "AIzaSyAVazxROYpygBw0xMhJlhbvrAaF1pmicEc",
      authDomain: "scm-quiz-df0e6.firebaseapp.com",
      databaseURL: "https://scm-quiz-df0e6-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "scm-quiz-df0e6",
      storageBucket: "scm-quiz-df0e6.firebasestorage.app",
      messagingSenderId: "30616205850",
      appId: "1:30616205850:web:224b6386ee807700d26fa3"
    };


    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);

    let teamId = null;
    let teamName = "";

    let timeLeft = 45;
    let timerInterval = null;
    let hasAnswered = false;


    // チーム参加
    async function joinQuiz() {

      teamName =
        document.getElementById("teamName").value.trim();

      if (teamName === "") {
        alert("チーム名を入力してください！");
        return;
      }

      const joinButton =
        document.getElementById("joinButton");

      joinButton.disabled = true;
      joinButton.textContent = "参加中...";

      try {

        const teamsRef =
          ref(database, "teams");

        const newTeamRef =
          push(teamsRef);

        teamId = newTeamRef.key;

        await set(newTeamRef, {
          name: teamName,
          score: 0,
          joinedAt: Date.now()
        });

        document.getElementById(
          "displayTeamName"
        ).textContent = teamName;

        document.getElementById(
          "joinScreen"
        ).style.display = "none";

        document.getElementById(
          "waitingScreen"
        ).style.display = "flex";

      } catch (error) {

        console.error(error);

        alert(
          "参加登録に失敗しました。もう一度お試しください。"
        );

        joinButton.disabled = false;
        joinButton.textContent =
          "クイズに参加する";
      }
    }


    // テスト問題開始
    function startQuiz() {

      document.getElementById(
        "waitingScreen"
      ).style.display = "none";

      document.getElementById(
        "quizScreen"
      ).style.display = "flex";

      timeLeft = 45;
      hasAnswered = false;

      document.getElementById(
        "timer"
      ).textContent = timeLeft;

      timerInterval = setInterval(() => {

        timeLeft--;

        document.getElementById(
          "timer"
        ).textContent = timeLeft;

        if (timeLeft <= 0) {

          clearInterval(timerInterval);

          timeUp();
        }

      }, 1000);
    }


    // 回答
    async function selectAnswer(letter, answerText) {

      if (hasAnswered) return;

      hasAnswered = true;

      clearInterval(timerInterval);

      try {

        if (teamId) {

          await set(
            ref(
              database,
              "answers/q1/" + teamId
            ),
            {
              teamName: teamName,
              answer: letter,
              answerText: answerText,
              remainingSeconds: timeLeft,
              answeredAt: Date.now()
            }
          );
        }

      } catch (error) {

        console.error(error);
      }

      document.getElementById(
        "selectedAnswer"
      ).textContent =
        "あなたの回答：" +
        letter +
        "「" +
        answerText +
        "」";

      document.getElementById(
        "quizScreen"
      ).style.display = "none";

      document.getElementById(
        "answeredScreen"
      ).style.display = "flex";
    }


    function timeUp() {

      hasAnswered = true;

      document.getElementById(
        "selectedAnswer"
      ).textContent =
        "時間切れ：回答なし";

      document.getElementById(
        "quizScreen"
      ).style.display = "none";

      document.getElementById(
        "answeredScreen"
      ).style.display = "flex";
    }


    // ボタン設定

    document.getElementById(
      "joinButton"
    ).addEventListener(
      "click",
      joinQuiz
    );

    document.getElementById(
      "testStartButton"
    ).addEventListener(
      "click",
      startQuiz
    );

    document.querySelectorAll(
      ".answer"
    ).forEach(button => {

      button.addEventListener(
        "click",
        () => {

          selectAnswer(
            button.dataset.letter,
            button.dataset.text
          );
        }
      );

    });

  </script>

</body>
</html>
