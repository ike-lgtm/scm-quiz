<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SCM QUIZ</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f4f5f7;
      color: #222;
    }

    .screen {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 520px;
      background: white;
      border-radius: 24px;
      padding: 36px 24px;
      text-align: center;
      box-shadow: 0 10px 35px rgba(0,0,0,0.10);
    }

    h1 {
      font-size: 42px;
      margin: 0 0 8px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 36px;
    }

    .label {
      display: block;
      text-align: left;
      font-weight: bold;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 16px;
      font-size: 18px;
      border: 2px solid #ddd;
      border-radius: 12px;
      margin-bottom: 16px;
    }

    button {
      cursor: pointer;
    }

    .main-button {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 12px;
      font-size: 18px;
      font-weight: bold;
      background: #222;
      color: white;
    }

    .main-button:hover {
      opacity: 0.85;
    }

    #waitingScreen,
    #quizScreen,
    #answeredScreen {
      display: none;
    }

    .team-name {
      font-size: 28px;
      font-weight: bold;
      margin: 20px 0;
    }

    .waiting-text {
      color: #666;
      line-height: 1.8;
      margin-bottom: 28px;
    }

    /* クイズ画面 */

    .quiz-card {
      padding-top: 24px;
    }

    .quiz-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .question-number {
      font-weight: bold;
      font-size: 18px;
    }

    .timer {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: #222;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 26px;
      font-weight: bold;
    }

    .question {
      font-size: 24px;
      line-height: 1.5;
      font-weight: bold;
      margin: 20px 0 30px;
    }

    .answers {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .answer {
      min-height: 100px;
      border: none;
      border-radius: 16px;
      color: white;
      font-size: 18px;
      font-weight: bold;
      padding: 14px;
    }

    .answer-a {
      background: #d83b3b;
    }

    .answer-b {
      background: #2878c8;
    }

    .answer-c {
      background: #d49b16;
    }

    .answer-d {
      background: #32965d;
    }

    .answer:disabled {
      opacity: 0.5;
      cursor: default;
    }

    .answer-letter {
      display: block;
      font-size: 26px;
      margin-bottom: 6px;
    }

    /* 回答完了 */

    .check {
      font-size: 60px;
      margin-bottom: 10px;
    }

    .selected-answer {
      margin-top: 24px;
      padding: 16px;
      background: #f4f5f7;
      border-radius: 12px;
      font-weight: bold;
    }

    .small-text {
      color: #777;
      font-size: 14px;
      margin-top: 20px;
    }

  </style>
</head>

<body>

  <!-- ① チーム名入力 -->
  <div class="screen" id="joinScreen">
    <div class="card">

      <h1>SCM QUIZ</h1>

      <p class="subtitle">
        第一回 部署横断！チーム対抗クイズ！
      </p>

      <label class="label">
        チーム名
      </label>

      <input
        type="text"
        id="teamName"
        placeholder="チーム名を入力してください"
        maxlength="20"
      >

      <button
        class="main-button"
        onclick="joinQuiz()"
      >
        クイズに参加する
      </button>

    </div>
  </div>


  <!-- ② 待機画面 -->
  <div class="screen" id="waitingScreen">
    <div class="card">

      <p>あなたのチーム</p>

      <div
        class="team-name"
        id="displayTeamName"
      ></div>

      <h2>参加完了！</h2>

      <p class="waiting-text">
        クイズ開始まで<br>
        そのままお待ちください。
      </p>

      <!-- 今はテスト用 -->
      <button
        class="main-button"
        onclick="startQuiz()"
      >
        テスト問題を開始
      </button>

      <p class="small-text">
        ※現在は動作確認用です
      </p>

    </div>
  </div>


  <!-- ③ クイズ画面 -->
  <div class="screen" id="quizScreen">
    <div class="card quiz-card">

      <div class="quiz-header">

        <div class="question-number">
          Q1
        </div>

        <div class="timer" id="timer">
          45
        </div>

      </div>

      <div class="question">
        SCM QUIZの制限時間は？
      </div>

      <div class="answers">

        <button
          class="answer answer-a"
          onclick="selectAnswer('A', '15秒')"
        >
          <span class="answer-letter">A</span>
          15秒
        </button>

        <button
          class="answer answer-b"
          onclick="selectAnswer('B', '30秒')"
        >
          <span class="answer-letter">B</span>
          30秒
        </button>

        <button
          class="answer answer-c"
          onclick="selectAnswer('C', '45秒')"
        >
          <span class="answer-letter">C</span>
          45秒
        </button>

        <button
          class="answer answer-d"
          onclick="selectAnswer('D', '60秒')"
        >
          <span class="answer-letter">D</span>
          60秒
        </button>

      </div>

    </div>
  </div>


  <!-- ④ 回答完了画面 -->
  <div class="screen" id="answeredScreen">
    <div class="card">

      <div class="check">
        ✓
      </div>

      <h2>回答完了！</h2>

      <p>
        回答を受け付けました。
      </p>

      <div
        class="selected-answer"
        id="selectedAnswer"
      ></div>

      <p class="waiting-text">
        次の問題まで<br>
        そのままお待ちください。
      </p>

    </div>
  </div>


  <script>

    let timeLeft = 45;
    let timerInterval = null;
    let hasAnswered = false;


    // チーム参加
    function joinQuiz() {

      const teamName =
        document.getElementById("teamName").value.trim();

      if (teamName === "") {
        alert("チーム名を入力してください！");
        return;
      }

      document.getElementById("displayTeamName").textContent =
        teamName;

      document.getElementById("joinScreen").style.display =
        "none";

      document.getElementById("waitingScreen").style.display =
        "flex";
    }


    // クイズ開始
    function startQuiz() {

      document.getElementById("waitingScreen").style.display =
        "none";

      document.getElementById("quizScreen").style.display =
        "flex";

      timeLeft = 45;
      hasAnswered = false;

      document.getElementById("timer").textContent =
        timeLeft;

      timerInterval = setInterval(function() {

        timeLeft--;

        document.getElementById("timer").textContent =
          timeLeft;

        if (timeLeft <= 0) {

          clearInterval(timerInterval);

          timeUp();
        }

      }, 1000);
    }


    // 回答
    function selectAnswer(letter, answerText) {

      if (hasAnswered) {
        return;
      }

      hasAnswered = true;

      clearInterval(timerInterval);

      document.getElementById("selectedAnswer").textContent =
        "あなたの回答：" + letter + "「" + answerText + "」";

      document.getElementById("quizScreen").style.display =
        "none";

      document.getElementById("answeredScreen").style.display =
        "flex";
    }


    // 時間切れ
    function timeUp() {

      hasAnswered = true;

      document.getElementById("selectedAnswer").textContent =
        "時間切れ：回答なし";

      document.getElementById("quizScreen").style.display =
        "none";

      document.getElementById("answeredScreen").style.display =
        "flex";
    }

  </script>

</body>
</html>
