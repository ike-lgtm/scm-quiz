<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SCM QUIZ</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    .container {
      width: min(92%, 620px);
      margin: 0 auto;
      padding: 24px 0 40px;
    }

    .card {
      background: #fff;
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 6px 24px rgba(0,0,0,0.08);
    }

    h1 {
      text-align: center;
      margin: 0 0 8px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 28px;
    }

    .hidden {
      display: none !important;
    }

    input {
      width: 100%;
      padding: 16px;
      border: 1px solid #ccc;
      border-radius: 12px;
      font-size: 18px;
      margin-bottom: 14px;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 16px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .primary {
      background: #222;
      color: #fff;
    }

    .center {
      text-align: center;
    }

    .team-name {
      font-size: 26px;
      font-weight: bold;
      text-align: center;
      margin: 20px 0 8px;
    }

    .question-number {
      font-size: 16px;
      font-weight: bold;
      color: #666;
      margin-bottom: 10px;
    }

    .question {
      font-size: 22px;
      line-height: 1.5;
      font-weight: bold;
      margin-bottom: 18px;
    }

    .images {
      display: grid;
      gap: 10px;
      margin-bottom: 18px;
    }

    .images.two {
      grid-template-columns: 1fr 1fr;
    }

    .images img {
      width: 100%;
      max-height: 260px;
      object-fit: contain;
      border-radius: 12px;
      background: #eee;
    }

    .timer-label {
      text-align: center;
      color: #777;
      font-size: 13px;
    }

    .timer {
      text-align: center;
      font-size: 46px;
      font-weight: bold;
      margin: 2px 0 18px;
    }

    .choices {
      display: grid;
      gap: 12px;
    }

    .choice {
      text-align: left;
      background: #fff;
      color: #222;
      border: 2px solid #ddd;
    }

    .choice:disabled {
      opacity: 0.5;
      cursor: default;
    }

    .status {
      text-align: center;
      font-size: 20px;
      font-weight: bold;
      margin: 20px 0 10px;
    }

    .result-mark {
      text-align: center;
      font-size: 58px;
      margin-bottom: 8px;
    }

    .points {
      text-align: center;
      font-size: 36px;
      font-weight: bold;
      margin: 16px 0;
    }

    .correct-answer {
      text-align: center;
      margin-top: 14px;
      font-size: 18px;
      line-height: 1.5;
    }

    .small {
      color: #777;
      font-size: 14px;
      line-height: 1.6;
    }
  </style>
</head>

<body>

<div class="container">

  <!-- チーム登録 -->
  <section id="joinScreen" class="card">

    <h1>SCM QUIZ</h1>

    <div class="subtitle">
      第一回 部署横断！チーム対抗クイズ！
    </div>

    <input
      id="teamNameInput"
      type="text"
      maxlength="30"
      placeholder="チーム名を入力"
    >

    <button id="joinButton" class="primary">
      クイズに参加する
    </button>

  </section>


  <!-- 待機 -->
  <section id="waitingScreen" class="card hidden">

    <h1>SCM QUIZ</h1>

    <div id="waitingTeamName" class="team-name"></div>

    <div class="status">
      参加完了！
    </div>

    <p class="center">
      クイズ開始まで<br>
      この画面のままお待ちください。
    </p>

    <p class="small center">
      運営が問題を開始すると
      自動的に画面が切り替わります。
    </p>

  </section>


  <!-- 問題 -->
  <section id="questionScreen" class="card hidden">

    <div id="questionNumber" class="question-number"></div>

    <div id="questionText" class="question"></div>

    <div id="questionImages" class="images"></div>

    <div class="timer-label">
      残り時間
    </div>

    <div id="timer" class="timer">
      45
    </div>

    <div id="choices" class="choices"></div>

  </section>


  <!-- 回答済み -->
  <section id="answeredScreen" class="card hidden">

    <h1>回答完了！</h1>

    <div class="status">
      回答を受け付けました
    </div>

    <p class="center">
      正解発表までお待ちください。
    </p>

  </section>


  <!-- 正解発表 -->
  <section id="resultScreen" class="card hidden">

    <div id="resultMark" class="result-mark"></div>

    <div id="resultTitle" class="status"></div>

    <div id="resultPoints" class="points"></div>

    <div id="correctAnswer" class="correct-answer"></div>

    <p class="small center">
      次の問題までお待ちください。
    </p>

  </section>

</div>


<script type="module">

import {
  initializeApp
}
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";


import {
  getDatabase,
  ref,
  push,
  set,
  onValue,
  get,
  serverTimestamp
}
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";


const firebaseConfig = {

  apiKey:
    "AIzaSyAVazxROYpygBw0xMhJlhbvrAaF1pmicEc",

  authDomain:
    "scm-quiz-df0e6.firebaseapp.com",

  databaseURL:
    "https://scm-quiz-df0e6-default-rtdb.asia-southeast1.firebasedatabase.app",

  projectId:
    "scm-quiz-df0e6",

  storageBucket:
    "scm-quiz-df0e6.firebasestorage.app",

  messagingSenderId:
    "30616205850",

  appId:
    "1:30616205850:web:224b6386ee807700d26fa3"
};


const app =
  initializeApp(firebaseConfig);

const database =
  getDatabase(app);


/* ==========================================
   問題データ
========================================== */

const questions = {

  practice: {

    label: "練習問題",

    text:
      "習志野拠点の最寄り駅は？",

    choices: [
      "南船橋駅",
      "幕張豊砂駅",
      "新習志野駅",
      "新浦安駅"
    ],

    correct: 1,

    images: []

  },


  q1: {

    label: "Q1",

    text:
      "船橋・習志野を足したロジ面積数（㎡）は？ちなみに1坪は3.30578㎡です。",

    choices: [
      "約18,843㎡",
      "約19,112㎡",
      "約20,896㎡",
      "約17,456㎡"
    ],

    correct: 0,

    images: []

  },


  q2: {

    label: "Q2",

    text:
      "勤続年数が一番長いPAがいるチームはどこ？",

    choices: [
      "販売1部 販売1G",
      "販売1部 販売3G",
      "toC販売部 出品管理G",
      "物流管理部 千葉物流管理G"
    ],

    correct: 0,

    images: []

  },


  q3: {

    label: "Q3",

    text:
      "上半期バイセルALL（グループ含む）総買取点数は？ ※バーコード点数",

    choices: [
      "準備中",
      "準備中",
      "準備中",
      "準備中"
    ],

    correct: null,

    images: []

  },


  q4: {

    label: "Q4",

    text:
      "現在（10月1日）の貴金属相場1gの相場は？",

    choices: [
      "準備中",
      "準備中",
      "準備中",
      "準備中"
    ],

    correct: null,

    images: []

  },


  q5: {

    label: "Q5",

    text:
      "ルイ・ヴィトンのモノグラム柄やダミエ柄は、ある国の伝統的な文様から着想を得て生まれました。その国はどこでしょうか？",

    choices: [
      "イタリア",
      "フランス",
      "ドイツ",
      "日本"
    ],

    correct: 3,

    images: []

  },


  q6: {

    label: "Q6",

    text:
      "【NJ】アレキサンドライトの特徴である「変色効果（カラーチェンジ）」を引き起こす主な微量元素は何でしょうか？",

    choices: [
      "準備中",
      "準備中",
      "準備中",
      "準備中"
    ],

    correct: null,

    images: []

  },


  q7: {

    label: "Q7",

    text:
      "【骨董】高い順に並べてください",

    choices: [
      "準備中",
      "準備中",
      "準備中",
      "準備中"
    ],

    correct: null,

    images: []

  },


  q8: {

    label: "Q8",

    text:
      "準備中",

    choices: [
      "準備中",
      "準備中",
      "準備中",
      "準備中"
    ],

    correct: null,

    images: []

  },


  q9: {

    label: "Q9",

    text:
      "準備中",

    choices: [
      "準備中",
      "準備中",
      "準備中",
      "準備中"
    ],

    correct: null,

    images: []

  },


  q10: {

    label: "Q10",

    text:
      "徳重社長がトップメッセージで紹介している絵の名前は？",

    choices: [
      "準備中",
      "準備中",
      "準備中",
      "準備中"
    ],

    correct: null,

    images: []

  }

};


/* ==========================================
   DOM
========================================== */

const joinScreen =
  document.getElementById("joinScreen");

const waitingScreen =
  document.getElementById("waitingScreen");

const questionScreen =
  document.getElementById("questionScreen");

const answeredScreen =
  document.getElementById("answeredScreen");

const resultScreen =
  document.getElementById("resultScreen");


const teamNameInput =
  document.getElementById("teamNameInput");

const joinButton =
  document.getElementById("joinButton");

const waitingTeamName =
  document.getElementById("waitingTeamName");


const questionNumber =
  document.getElementById("questionNumber");

const questionText =
  document.getElementById("questionText");

const questionImages =
  document.getElementById("questionImages");

const timer =
  document.getElementById("timer");

const choicesElement =
  document.getElementById("choices");


const resultMark =
  document.getElementById("resultMark");

const resultTitle =
  document.getElementById("resultTitle");

const resultPoints =
  document.getElementById("resultPoints");

const correctAnswer =
  document.getElementById("correctAnswer");


let teamId =
  localStorage.getItem("scmQuizTeamId");

let teamName =
  localStorage.getItem("scmQuizTeamName");

let currentQuestionKey = null;

let timerInterval = null;

let timeLeft = 45;


/* ==========================================
   画面切替
========================================== */

function showScreen(screen) {

  [
    joinScreen,
    waitingScreen,
    questionScreen,
    answeredScreen,
    resultScreen
  ].forEach(
    element =>
      element.classList.add("hidden")
  );

  screen.classList.remove("hidden");

}


/* ==========================================
   既存チーム確認
========================================== */

async function checkExistingTeam() {

  if (!teamId || !teamName) {

    showScreen(joinScreen);
    return;

  }


  try {

    const snapshot =
      await get(
        ref(
          database,
          `teams/${teamId}`
        )
      );


    if (snapshot.exists()) {

      waitingTeamName.textContent =
        teamName;

      showScreen(waitingScreen);
      return;

    }


    localStorage.removeItem(
      "scmQuizTeamId"
    );

    localStorage.removeItem(
      "scmQuizTeamName"
    );


    teamId = null;
    teamName = null;

    showScreen(joinScreen);


  } catch (error) {

    console.error(
      "チーム確認エラー",
      error
    );

    waitingTeamName.textContent =
      teamName;

    showScreen(waitingScreen);

  }

}


await checkExistingTeam();


/* ==========================================
   チーム参加
========================================== */

joinButton.addEventListener(
  "click",
  async () => {

    const name =
      teamNameInput.value.trim();


    if (!name) {

      alert(
        "チーム名を入力してください"
      );

      return;

    }


    joinButton.disabled = true;
    joinButton.textContent = "参加中...";


    try {

      const newTeamRef =
        push(
          ref(database, "teams")
        );


      teamId =
        newTeamRef.key;

      teamName =
        name;


      await set(
        newTeamRef,
        {
          name: teamName,
          joinedAt:
            serverTimestamp()
        }
      );


      localStorage.setItem(
        "scmQuizTeamId",
        teamId
      );

      localStorage.setItem(
        "scmQuizTeamName",
        teamName
      );


      waitingTeamName.textContent =
        teamName;


      showScreen(
        waitingScreen
      );


      watchMyTeam();


    } catch (error) {

      console.error(error);

      alert(
        "参加に失敗しました。もう一度お試しください。"
      );

      joinButton.disabled = false;

      joinButton.textContent =
        "クイズに参加する";

    }

  }
);


/* ==========================================
   チーム削除監視
========================================== */

let teamWatcherStarted = false;

function watchMyTeam() {

  if (!teamId) return;

  if (teamWatcherStarted) return;

  teamWatcherStarted = true;


  onValue(
    ref(
      database,
      `teams/${teamId}`
    ),

    snapshot => {

      if (snapshot.exists()) {
        return;
      }


      localStorage.removeItem(
        "scmQuizTeamId"
      );

      localStorage.removeItem(
        "scmQuizTeamName"
      );


      teamId = null;
      teamName = null;

      currentQuestionKey = null;

      clearInterval(
        timerInterval
      );

      teamWatcherStarted = false;


      showScreen(
        joinScreen
      );

    }
  );

}


if (teamId) {
  watchMyTeam();
}


/* ==========================================
   GAME監視
========================================== */

onValue(
  ref(database, "game"),

  async snapshot => {

    if (!teamId) return;


    const game =
      snapshot.val();


    if (!game) {

      showScreen(
        waitingScreen
      );

      return;

    }


    if (
      game.phase === "waiting"
    ) {

      currentQuestionKey = null;

      clearInterval(
        timerInterval
      );


      waitingTeamName.textContent =
        teamName;


      showScreen(
        waitingScreen
      );

      return;

    }


    if (
      game.phase === "question"
    ) {

      const key =
        game.currentQuestion;


      if (!questions[key]) {
        return;
      }


      await openQuestion(
        key,
        game
      );


      return;

    }


    if (
      game.phase === "result"
    ) {

      const key =
        game.currentQuestion;


      if (!questions[key]) {
        return;
      }


      await showResult(
        key
      );

      return;

    }

  }
);


/* ==========================================
   問題表示
========================================== */

async function openQuestion(
  key,
  game
) {

  const question =
    questions[key];


  currentQuestionKey =
    key;


  clearInterval(
    timerInterval
  );


  const answerRef =
    ref(
      database,
      `answers/${key}/${teamId}`
    );


  const existingAnswer =
    await get(
      answerRef
    );


  if (
    existingAnswer.exists()
  ) {

    showScreen(
      answeredScreen
    );

    return;

  }


  questionNumber.textContent =
    question.label;

  questionText.textContent =
    question.text;


  questionImages.innerHTML =
    "";

  questionImages.classList.remove(
    "two"
  );


  if (
    question.images &&
    question.images.length > 0
  ) {

    if (
      question.images.length === 2
    ) {

      questionImages.classList.add(
        "two"
      );

    }


    question.images.forEach(
      src => {

        const img =
          document.createElement(
            "img"
          );

        img.src = src;

        img.alt =
          "問題画像";

        questionImages.appendChild(
          img
        );

      }
    );

  }


  choicesElement.innerHTML =
    "";


  const letters =
    ["A", "B", "C", "D"];


  question.choices.forEach(
    (choice, index) => {

      const button =
        document.createElement(
          "button"
        );

      button.className =
        "choice";

      button.textContent =
        `${letters[index]}：${choice}`;


      button.addEventListener(
        "click",
        () => {

          submitAnswer(
            key,
            index
          );

        }
      );


      choicesElement.appendChild(
        button
      );

    }
  );


  showScreen(
    questionScreen
  );


  startTimer();

}


/* ==========================================
   45秒タイマー
========================================== */

function startTimer() {

  clearInterval(
    timerInterval
  );


  timeLeft = 45;

  timer.textContent =
    timeLeft;


  timerInterval =
    setInterval(
      () => {

        timeLeft--;

        timer.textContent =
          Math.max(
            timeLeft,
            0
          );


        if (
          timeLeft <= 0
        ) {

          clearInterval(
            timerInterval
          );


          document
            .querySelectorAll(
              ".choice"
            )
            .forEach(
              button =>
                button.disabled = true
            );


          setTimeout(
            () => {

              showScreen(
                answeredScreen
              );

            },
            400
          );

        }

      },
      1000
    );

}


/* ==========================================
   回答送信
========================================== */

async function submitAnswer(
  key,
  choiceIndex
) {

  if (
    timeLeft <= 0
  ) {
    return;
  }


  document
    .querySelectorAll(
      ".choice"
    )
    .forEach(
      button =>
        button.disabled = true
    );


  clearInterval(
    timerInterval
  );


  const answerRef =
    ref(
      database,
      `answers/${key}/${teamId}`
    );


  try {

    const existing =
      await get(
        answerRef
      );


    if (
      existing.exists()
    ) {

      showScreen(
        answeredScreen
      );

      return;

    }


    await set(
      answerRef,
      {
        teamId:
          teamId,

        teamName:
          teamName,

        choice:
          choiceIndex,

        answeredAt:
          serverTimestamp()
      }
    );


    showScreen(
      answeredScreen
    );


  } catch (error) {

    console.error(
      "回答送信エラー",
      error
    );


    alert(
      "回答の送信に失敗しました。"
    );

  }

}


/* ==========================================
   正解発表 + 確定得点表示
========================================== */

async function showResult(
  key
) {

  clearInterval(
    timerInterval
  );


  const question =
    questions[key];


  /* 自分の回答取得 */

  const answerSnapshot =
    await get(
      ref(
        database,
        `answers/${key}/${teamId}`
      )
    );


  const answer =
    answerSnapshot.val();


  const isCorrect =
    answer &&
    question.correct !== null &&
    answer.choice ===
      question.correct;


  /* 正誤表示 */

  if (isCorrect) {

    resultMark.textContent =
      "⭕";

    resultTitle.textContent =
      "正解！";

  } else {

    resultMark.textContent =
      "❌";

    resultTitle.textContent =
      answer
        ? "残念！"
        : "時間切れ";

  }


  /* ======================================
     練習問題
  ====================================== */

  if (
    key === "practice"
  ) {

    resultPoints.textContent =
      "練習問題・得点なし";

  }


  /* ======================================
     本番問題
     Firebaseの確定得点を取得
  ====================================== */

  else {

    try {

      const scoreSnapshot =
        await get(
          ref(
            database,
            `scores/${teamId}/${key}`
          )
        );


      if (
        scoreSnapshot.exists()
      ) {

        const points =
          Number(
            scoreSnapshot.val()
          );


        resultPoints.textContent =
          `+${points.toLocaleString()} pt`;

      } else {

        resultPoints.textContent =
          "0 pt";

      }


    } catch (error) {

      console.error(
        "得点取得エラー",
        error
      );


      resultPoints.textContent =
        "得点確認中";

    }

  }


  /* 正解表示 */

  if (
    question.correct !== null
  ) {

    const letters =
      ["A", "B", "C", "D"];


    correctAnswer.innerHTML =
      `正解：<strong>${letters[question.correct]}：${question.choices[question.correct]}</strong>`;

  } else {

    correctAnswer.textContent =
      "";

  }


  showScreen(
    resultScreen
  );

}

</script>

</body>
</html>
